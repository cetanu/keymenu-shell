name: Release

on:
  push:
    branches:
      - master
      - main

jobs:
  release:
    name: Release (release-plz)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Get released tag
        id: release
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: echo "tag=$(jq -r '.[0].tag // empty' <<< \"$RELEASES\")" >> "$GITHUB_OUTPUT"

  upload-binaries:
    name: Upload ${{ matrix.target }} binary
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build release binary
        run: cargo zigbuild --locked --release --target ${{ matrix.target }} --bin keymenu

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="keymenu-${TARGET}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "$archive" keymenu
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: gh release upload "$RELEASE_TAG" "keymenu-${TARGET}.tar.gz" "keymenu-${TARGET}.tar.gz.sha256" --clobber
